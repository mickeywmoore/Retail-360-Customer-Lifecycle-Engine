name: Retail-360 CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package in editable mode
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run unit & integration test suite
        run: python -m unittest discover -s tests -v

      - name: Smoke-test CLI pipeline & JSON artifact export
        run: |
          retail360 run-pipeline --orders 1000 --customers 250 --epochs 25 --output-json artifacts/ci_report.json
          test -f artifacts/ci_report.json
